[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "enceladus-big-data"
version = "0.1.0"
description = "Burn-data report generation for the Sociedade Brasileira de Queimaduras"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "boto3>=1.40,<2",
  "PyYAML>=6.0,<7",
  "quart>=0.20,<0.24",
  "quart-cors>=0.8,<0.9",
  "redis>=6.0,<9",
]

[project.optional-dependencies]
dev = [
  "cfn-lint>=1.39,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["default_config", "main", "send_email", "settings", "storage"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
