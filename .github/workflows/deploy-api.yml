name: Deploy API to EC2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-api.yml"
      - "deploy/**"
      - "flake.nix"
      - "flake.lock"
      - "go/**"
      - "pyproject.toml"
      - "scripts/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ANR }}
      - name: Deploy through Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          deploy_command="sudo curl --fail --location --retry 5 https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/deploy/deploy.sh --output /opt/enceladus/deploy.sh && sudo chmod 0755 /opt/enceladus/deploy.sh && sudo /opt/enceladus/deploy.sh $GITHUB_REF_NAME"
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "commands=['$deploy_command']" \
            --query Command.CommandId \
            --output text)
          echo "deploy command: $command_id"
          for i in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo Pending)
            echo "  attempt $i: $status"
            case "$status" in
              Success) echo "deploy succeeded" && exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "deploy failed:"
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StatusDetails, StandardErrorContent' \
                  --output text
                exit 1
                ;;
              *) sleep 15 ;;
            esac
          done
          echo "deploy did not finish within 30 minutes"
          exit 1