name: Deploy API to EC2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-api.yml"
      - "deploy/**"
      - "docker/ibge/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ANR }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - name: Build and push API image
        id: image
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=true \
            --sbom=true \
            --tag "$ECR_REPOSITORY_URI:$GITHUB_SHA" \
            --push \
            --metadata-file image-metadata.json \
            .
          digest=$(jq --raw-output '.["containerimage.digest"]' image-metadata.json)
          echo "reference=$ECR_REPOSITORY_URI@$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy through Systems Manager
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          deploy_command="sudo curl --fail --location --retry 5 https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/deploy/deploy.sh --output /opt/enceladus/deploy.sh && sudo chmod 0755 /opt/enceladus/deploy.sh && sudo /opt/enceladus/deploy.sh $IMAGE_REFERENCE"
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "commands=['$deploy_command']" \
            --query Command.CommandId \
            --output text)
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"
