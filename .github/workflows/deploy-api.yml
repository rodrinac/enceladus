name: Deploy API to EC2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-api.yml"
      - "deploy/**"
      - "flake.nix"
      - "flake.lock"
      - "go/**"
      - "pyproject.toml"
      - "scripts/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ANR }}
      - name: Deploy through Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          deploy_command="sudo curl --fail --location --retry 5 https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/deploy/deploy.sh --output /opt/enceladus/deploy.sh && sudo chmod 0755 /opt/enceladus/deploy.sh && sudo /opt/enceladus/deploy.sh $GITHUB_REF_NAME"
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "commands=['$deploy_command']" \
            --query Command.CommandId \
            --output text)
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"