name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python -m pip install --disable-pip-version-check --upgrade cfn-lint
      - run: cfn-lint infra/ec2.yml
      - run: shellcheck deploy/deploy.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: gofmt -l .
      - run: go vet ./...
      - run: go test ./...

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          upstream_cache: true
      - name: Build the API and population apps
        run: |
          nix build .#api
          nix build .#population
      - name: Validate R report inputs and DataSUS cache
        run: |
          nix develop . --command bash -c 'cd src && Rscript ../tests/test_report_years.R && Rscript ../tests/test_datasus_cache.R'