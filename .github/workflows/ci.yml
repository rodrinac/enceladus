name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --editable '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: cfn-lint infra/ec2.yml
      - run: shellcheck deploy/deploy.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Validate R report inputs and DataSUS cache
        run: |
          docker compose run --rm --no-deps \
            --volume "$PWD/tests:/app/tests:ro" \
            app Rscript /app/tests/test_report_years.R
          docker compose run --rm --no-deps \
            --volume "$PWD/tests:/app/tests:ro" \
            app Rscript /app/tests/test_datasus_cache.R
