name: enceladus

services:
  app:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      AWS_DEFAULT_REGION: eu-west-1
      AWS_REGION: eu-west-1
      ENCELADUS_POPULATION_DATA_PATH: /var/lib/enceladus/data/population.csv
      ENCELADUS_DATASUS_MAX_YEAR_PATH: /var/lib/enceladus/data/datasus-max-year.txt
      ENCELADUS_DATASUS_CACHE_PATH: /var/lib/enceladus/.cache/datasus
      ENCELADUS_DATASUS_CACHE_MAX_BYTES: ${ENCELADUS_DATASUS_CACHE_MAX_BYTES:-5368709120}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    depends_on:
      population-data:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${ENCELADUS_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      - population-data:/var/lib/enceladus/data:ro
      - reports-data:/var/lib/enceladus

  population-data:
    build:
      context: docker/ibge
    environment:
      IBGE_POPULATION_PERIOD: ${IBGE_POPULATION_PERIOD:-last%201}
      DATASUS_MAX_YEAR_FALLBACK: 2024
    restart: "no"
    volumes:
      - population-data:/data

  web:
    build:
      context: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${ENCELADUS_PORT:-8000}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${ENCELADUS_WEB_PORT:-3000}:80"
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  population-data:
  redis-data:
  reports-data:
